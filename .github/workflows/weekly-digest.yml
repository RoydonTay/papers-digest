name: Weekly Papers Digest

on:
  schedule:
    - cron: "0 1 * * 1"        # 01:00 UTC Monday = 09:00 SGT Monday (Singapore has no DST)
  workflow_dispatch:
    inputs:
      week:
        description: "ISO week override, e.g. 2026-W33"
        required: false
      dry_run:
        description: "Render without sending"
        type: boolean
        default: false

permissions:
  contents: write               # needed only for the state commit

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run digest
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HF_TOKEN:       ${{ secrets.HF_TOKEN }}
          GMAIL_USER:     ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL:    ${{ secrets.RECIPIENT_EMAIL }}
        run: python -m src.main ${{ inputs.week && format('--week {0}', inputs.week) || '' }} ${{ inputs.dry_run == 'true' && '--dry-run' || '' }}
      - name: Upload rendered digest + logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ github.run_id }}
          path: |
            out/
            logs/
          retention-days: 14
      - name: Commit state
        if: success() && inputs.dry_run != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/seen.json
          git diff --staged --quiet || git commit -m "chore: update seen papers [skip ci]"
          git push
